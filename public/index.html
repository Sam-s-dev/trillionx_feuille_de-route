<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRILLIONX — Feuille de route Août–Décembre 2026</title>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- FontAwesome Icons CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- ApexCharts CDN -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<style>
  :root {
    /* Nouveau Thème : Blanc dominant & Déclinaisons de Violets */
    --bg: #fafaff;
    --surface: #ffffff;
    --surface-hover: #fcfbfe;
    --border: #e9e6fd;
    --border-hover: #ddd8fc;
    
    --ink: #1b1625;
    --muted: #6e6480;
    --muted-2: #a59cb6;
    
    /* Violets */
    --purple-primary: #7c3aed;
    --purple-hover: #6d28d9;
    --purple-tint: #f5f3ff;
    --purple-tint-2: #ede9fe;
    --purple-border: #ddd6fe;
    --purple-deep: #4c1d95;
    
    /* Difficultés & Accents */
    --diff-facile-bg: #f5f3ff;
    --diff-facile-color: #8b5cf6;
    --diff-moyenne-bg: #faf5ff;
    --diff-moyenne-color: #c084fc;
    --diff-elevee-bg: #ede9fe;
    --diff-elevee-color: #5b21b6;
    
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 8px;
    
    --font-display: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 40px 20px 100px; }

  /* ---------- Header ---------- */
  .hero { margin-bottom: 40px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--purple-primary); font-weight: 600; margin: 0 0 10px;
  }
  h1.title {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 5vw, 46px);
    margin: 0 0 12px; letter-spacing: -.02em; color: var(--ink);
  }
  .subtitle { color: var(--muted); font-size: 16px; margin: 0 0 24px; max-width: 800px; line-height: 1.6; }
  .team-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  
  .chip {
    font-size: 13px; padding: 8px 16px; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--border); color: var(--ink); font-weight: 500;
    transition: var(--transition); display:inline-flex; align-items:center; gap: 8px;
  }
  .chip:hover { border-color: var(--purple-border); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.05); }
  .chip i { color: var(--purple-primary); }
  .chip.partner { background: var(--purple-tint); border-color: var(--purple-border); color: var(--purple-deep); }
  .chip.partner i { color: var(--purple-deep); }

  /* ---------- Timeline / River ---------- */
  .river {
    margin: 40px 0 10px; padding: 30px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: 0 4px 20px rgba(124, 58, 237, 0.02);
    transition: var(--transition);
  }
  .river:hover { border-color: var(--border-hover); }
  .river-label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 24px; display: flex; align-items: center; gap: 8px;
  }
  .river-label i { color: var(--purple-primary); }
  .river-track { position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
  .river-line { position: absolute; top: 12px; left: 5%; right: 5%; height: 3px; background: var(--border); z-index: 0; }
  .river-line-fill { position: absolute; top: 12px; left: 5%; height: 3px; background: var(--purple-primary); z-index: 1; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  
  .river-node {
    position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;
    width: 15%; cursor: pointer; background: none; border: none; font-family: var(--font-body);
    outline: none; transition: var(--transition);
  }
  .river-dot {
    width: 24px; height: 24px; border-radius: 50%; background: var(--surface);
    border: 3px solid var(--border); margin-bottom: 12px; transition: var(--transition);
  }
  .river-node.done .river-dot { background: var(--purple-primary); border-color: var(--purple-primary); }
  .river-node.current .river-dot { background: var(--purple-primary); border-color: var(--purple-primary); box-shadow: 0 0 0 6px var(--purple-tint-2); }
  .river-node-title { font-size: 13px; font-weight: 600; text-align: center; color: var(--ink); line-height: 1.3; transition: var(--transition); }
  .river-node-range { font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); margin-top: 4px; text-align: center; }
  .river-node:hover .river-dot { border-color: var(--purple-primary); transform: scale(1.15); }
  .river-node:hover .river-node-title { color: var(--purple-primary); }

  /* ---------- Dashboard & Stats ("Graphiques de malades") ---------- */
  .dashboard-toggle-wrap { margin: 24px 0; display: flex; justify-content: center; }
  .dashboard-toggle-btn {
    font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--purple-primary);
    background: var(--purple-tint); border: 1px solid var(--purple-border); padding: 12px 24px;
    border-radius: 999px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px;
  }
  .dashboard-toggle-btn:hover { background: var(--purple-tint-2); transform: translateY(-2px); }
  .dashboard-toggle-btn i { transition: transform 0.3s; }
  .dashboard-toggle-btn.active i { transform: rotate(180deg); }

  .stats-dashboard {
    max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
    margin-bottom: 24px;
  }
  .stats-dashboard.open { max-height: 1000px; opacity: 1; margin-bottom: 40px; }
  
  .stats-grid { display: grid; grid-template-columns: 1fr 1.5fr 1.2fr; gap: 20px; }
  @media(max-width: 900px) { .stats-grid { grid-template-columns: 1fr; } }
  
  .stats-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 24px; box-shadow: 0 10px 30px rgba(124, 58, 237, 0.01);
  }
  .card-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
  .card-title i { color: var(--purple-primary); }

  /* ---------- Financial dashboard ---------- */
  .fin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
  @media(max-width: 900px) { .fin-grid { grid-template-columns: repeat(2, 1fr); } }
  .fin-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 22px; transition: var(--transition); box-shadow: 0 4px 15px rgba(124, 58, 237, 0.01);
  }
  .fin-card:hover { border-color: var(--purple-border); transform: translateY(-3px); }
  .fin-card .fin-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .fin-card .fin-value { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--ink); }
  .fin-card .fin-sub { font-size: 12px; color: var(--muted-2); margin-top: 6px; }
  .fin-card.total { background: var(--purple-tint); border-color: var(--purple-border); }
  .fin-card.total .fin-value { color: var(--purple-deep); }

  .caisse-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 26px; margin-bottom: 40px; box-shadow: 0 4px 20px rgba(124, 58, 237, 0.01);
    transition: var(--transition);
  }
  .caisse-panel:hover { border-color: var(--border-hover); }
  .caisse-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  .caisse-top .fin-label { font-size: 14px; font-weight: 700; color: var(--ink); text-transform: none; display: flex; align-items: center; gap: 8px; }
  .caisse-top .fin-label i { color: var(--purple-primary); }
  .caisse-input-wrap { display: flex; align-items: center; gap: 10px; }
  .caisse-input-wrap input {
    font-family: var(--font-mono); font-size: 16px; padding: 8px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); width: 160px; text-align: right; outline: none; transition: var(--transition);
  }
  .caisse-input-wrap input:focus { border-color: var(--purple-primary); box-shadow: 0 0 0 3px var(--purple-tint-2); }
  .caisse-input-wrap span { font-size: 13px; color: var(--muted); font-weight: 500; }
  
  .bar-track { height: 12px; border-radius: 999px; background: var(--purple-tint-2); overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--purple-primary), var(--purple-deep)); border-radius: 999px; transition: width 0.6s ease; }
  .caisse-note { font-size: 12.5px; color: var(--muted-2); margin-top: 10px; font-style: italic; display: flex; align-items: center; gap: 6px; }
  .caisse-note i { color: var(--purple-primary); }

  /* ---------- Phase sections ---------- */
  .phase {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    margin-bottom: 24px; overflow: hidden; transition: var(--transition);
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.01);
  }
  .phase:hover { border-color: var(--border-hover); box-shadow: 0 8px 24px rgba(124, 58, 237, 0.03); }
  .phase-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 28px; cursor: pointer; user-select: none; transition: var(--transition); }
  .phase-head:hover { background: var(--purple-tint); }
  .phase-head-left { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .phase-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--ink); }
  .phase-range { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  
  .phase-head-right { display: flex; align-items: center; gap: 18px; }
  .phase-progress-text { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 600; }
  .phase-progress-bar { width: 100px; height: 8px; border-radius: 999px; background: var(--purple-tint-2); overflow: hidden; }
  .phase-progress-fill { height: 100%; background: var(--purple-primary); border-radius: 999px; transition: width 0.4s ease; }
  .chevron { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: var(--muted); font-size: 16px; }
  .phase.collapsed .chevron { transform: rotate(-90deg); }
  .phase-body { border-top: 1px solid var(--border); padding: 12px 24px 24px; animation: slideDown 0.3s ease-out; }
  .phase.collapsed .phase-body { display: none; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    font-weight: 700; margin: 24px 12px 10px; display: flex; align-items: center; gap: 6px;
  }
  .task-group-label i { color: var(--purple-primary); font-size: 12px; }

  /* ---------- Tasks ---------- */
  .task-row {
    display: flex; align-items: flex-start; gap: 14px; padding: 14px; border-radius: var(--radius-md);
    transition: var(--transition); border: 1px solid transparent;
  }
  .task-row:hover { background: var(--bg); border-color: var(--border); transform: translateX(4px); }
  .task-row.done { opacity: .6; }
  
  .task-check {
    margin-top: 2px; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
    background: var(--surface); flex: 0 0 auto; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 12px; color: white; transition: var(--transition);
  }
  .task-check:hover { border-color: var(--purple-primary); }
  .task-row.done .task-check { background: var(--purple-primary); border-color: var(--purple-primary); }
  
  .task-main { flex: 1; min-width: 0; }
  .task-text {
    font-size: 14.5px; line-height: 1.5; color: var(--ink); cursor: text; word-break: break-word; font-weight: 500;
  }
  .task-row.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-text-input {
    font-family: var(--font-body); font-size: 14.5px; width: 100%; padding: 6px 10px;
    border-radius: var(--radius-sm); border: 1px solid var(--purple-primary); outline: none;
    box-shadow: 0 0 0 3px var(--purple-tint-2);
  }
  
  .task-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  
  .diff-badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    letter-spacing: .02em; border: 1px solid transparent; transition: var(--transition);
  }
  .diff-badge:hover { transform: translateY(-1px); }
  .diff-facile { background: var(--diff-facile-bg); color: var(--diff-facile-color); }
  .diff-moyenne { background: var(--diff-moyenne-bg); color: var(--diff-moyenne-color); }
  .diff-elevee { background: var(--diff-elevee-bg); color: var(--diff-elevee-color); }
  
  .move-select {
    font-family: var(--font-body); font-size: 11px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px 6px; cursor: pointer;
    outline: none; transition: var(--transition);
  }
  .move-select:hover { border-color: var(--purple-border); }

  .task-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; opacity: 0.3; transition: var(--transition); }
  .task-row:hover .task-actions { opacity: 1; }
  
  .icon-btn {
    width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid transparent;
    background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 13px; transition: var(--transition);
  }
  .icon-btn:hover { background: var(--purple-tint-2); color: var(--purple-primary); }
  .icon-btn.delete:hover { color: var(--terracotta); background: var(--terracotta-tint); }

  /* ---------- Add Row ---------- */
  .add-row { display: flex; gap: 12px; align-items: center; padding: 16px 12px 6px; flex-wrap: wrap; }
  .add-row input[type=text] {
    flex: 1; min-width: 220px; font-family: var(--font-body); font-size: 14px; padding: 10px 16px;
    border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface);
    outline: none; transition: var(--transition);
  }
  .add-row input[type=text]:focus { border-color: var(--purple-primary); box-shadow: 0 0 0 3px var(--purple-tint-2); }
  
  .add-row select {
    font-family: var(--font-body); font-size: 13px; padding: 9px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer;
    outline: none; transition: var(--transition);
  }
  .add-row select:focus { border-color: var(--purple-border); }
  
  .add-btn {
    font-family: var(--font-body); font-size: 13.5px; font-weight: 600; padding: 10px 20px;
    border-radius: var(--radius-md); border: none; background: var(--purple-primary); color: white;
    cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px;
  }
  .add-btn:hover { background: var(--purple-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2); }

  /* ---------- Footer ---------- */
  .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
  .footer-note { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .footer-note i { color: var(--purple-primary); }
  .reset-btn { font-size: 12.5px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
  .reset-btn:hover { color: var(--terracotta); }

  .loading { padding: 100px 0; text-align: center; color: var(--muted-2); font-family: var(--font-mono); font-size: 14px; }
  .loading i { font-size: 32px; color: var(--purple-primary); margin-bottom: 16px; }

  /* ---------- Responsive Mobile Design ---------- */
  @media(max-width: 900px) {
    .stats-grid { grid-template-columns: 1fr; }
    .fin-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media(max-width: 768px) {
    #app { padding: 24px 12px 70px; }
    .river-track {
      overflow-x: auto;
      padding-bottom: 16px;
      justify-content: flex-start;
      gap: 24px;
    }
    .river-node {
      width: 100px;
      flex-shrink: 0;
    }
    .river-line, .river-line-fill {
      display: none;
    }
    .task-actions {
      opacity: 1;
    }
    .footer-bar {
      flex-direction: column;
      gap: 16px;
      align-items: center;
      text-align: center;
    }
  }

  @media(max-width: 600px) {
    .hero { margin-bottom: 24px; }
    h1.title { font-size: 26px; }
    .subtitle { font-size: 14.5px; }
    .team-row { gap: 6px; }
    .chip { font-size: 12px; padding: 6px 12px; }
    
    .phase-head { padding: 14px 20px; }
    .phase-title { font-size: 16px; }
    .phase-range { font-size: 11px; }
    .phase-progress-bar { display: none; }
    .phase-body { padding: 10px 14px 18px; }
    
    .add-row { flex-direction: column; align-items: stretch; gap: 8px; }
    .add-row input[type=text], .add-row select, .add-btn { width: 100%; min-width: 0; }
    
    .task-row { padding: 10px 6px; }
    .task-text { font-size: 13.5px; }
    
    .fin-grid { grid-template-columns: 1fr; gap: 12px; }
    .fin-card { padding: 16px; }
    .fin-card .fin-value { font-size: 20px; }
    
    .caisse-panel { padding: 16px; margin-bottom: 24px; }
    .caisse-top .fin-label { font-size: 13px; }
    .caisse-input-wrap input { width: 100%; max-width: 120px; font-size: 14px; padding: 6px 10px; }
  }

  /* Support pour les terminaux sans survol tactile */
  @media (hover: none) {
    .task-row:hover { transform: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="loading">
    <i class="fa-solid fa-circle-notch fa-spin"></i><br>
    Chargement de la feuille de route TRILLIONX...
  </div>
</div>

<script>
const STORAGE_KEY = "trillionx-roadmap-aug-dec-2026-v1";
let state = null;
let charts = { global: null, phase: null, difficulty: null };
let dashboardOpen = false;

function uid(){ return 't' + Math.random().toString(36).slice(2,10); }

function defaultState(){
  const T = (text, difficulty) => ({ id: uid(), text, difficulty, done:false });
  return {
    caisseActuelle: 0,
    collapsed: {},
    phases: [
      {
        id:'p1', title:'Phase 1 — Préparation avant Fria', range:'1 – 15 août 2026',
        groups: [
          { label:'Smart School', tasks:[
            T("Finaliser complètement l'application Smart School", "elevee"),
            T("Effectuer les tests et corrections", "moyenne"),
            T("Déployer la version prête pour la mission (objectif : prête avant Fria)", "moyenne"),
            T("Appeler les fondateurs des écoles privées de Fria pour valider le marché", "facile"),
          ]},
          { label:'ORDIVEX', tasks:[
            T("Confirmer l'installation à la pharmacie de Koya (inventaire déjà fait)", "facile"),
            T("Finaliser la discussion avec la 2e pharmacie (responsable + mari)", "moyenne"),
            T("Installer ORDIVEX dans au moins 2 pharmacies avant le départ à Fria", "elevee"),
            T("Continuer la prospection de nouvelles pharmacies", "moyenne"),
          ]},
          { label:'Boutique Flow', tasks:[
            T("Prospection intensive par l'équipe (Mohamed Sams Deen Camara, Alseny Camara, Mohamed Iya Camara) + Djenabou Barry", "moyenne"),
            T("Former les commerçants à la nouvelle méthode : ils saisissent eux-mêmes leurs produits, avec accompagnement", "moyenne"),
            T("Transférer la responsabilité de prospection et d'acquisition à Djenabou Barry", "facile"),
          ]},
        ]
      },
      {
        id:'p2', title:'Phase 2 — Mission Fria', range:'15 – 31 août 2026',
        groups: [
          { label:'Sur place à Fria', tasks:[
            T("Départ pour Fria le 15 août — équipe : Mohamed Sams Deen Camara, Alseny Camara, Mohamed Iya Camara", "elevee"),
            T("Gérer le budget de mission : 1 000 000 GNF pris dans la caisse de l'entreprise", "facile"),
            T("Rencontrer les écoles privées de Fria", "elevee"),
            T("Installer Smart School dans les premiers établissements", "elevee"),
            T("Signer les premiers établissements", "elevee"),
          ]},
          { label:"Pendant l'absence, à Conakry", tasks:[
            T("Ne pas laisser le marché de Conakry vide — assurer un suivi à distance", "moyenne"),
            T("Trouver une solution pour obtenir la cartographie des écoles privées de Conakry", "moyenne"),
            T("Poursuivre les contacts avec les pharmacies", "facile"),
            T("Préparer les rendez-vous pour l'installation de nouvelles pharmacies au retour", "facile"),
          ]},
          { label:'Objectifs au retour', tasks:[

async function loadState(){
  try {
    const response = await fetch('/api/state');
    if (response.ok) {
      const data = await response.json();
      if (data && data.phases) return data;
    }
  } catch (e) {
    console.warn("Erreur chargement backend:", e);
  }

  try {
    const r = await window.storage.get(STORAGE_KEY, true);
    if (r && r.value) return JSON.parse(r.value);
  } catch(e) {
    try {
      const local = localStorage.getItem(STORAGE_KEY);
      if (local) return JSON.parse(local);
    } catch(ex) {}
  }
  return null;
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    // 1. Sauvegarde backend SQLite
    try {
      await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
      // Mettre à jour les stats & graphiques
      updateStatsAndCharts();
    } catch(e) {
      console.error("Erreur de sauvegarde backend :", e);
    }

    // 2. Sauvegarde de secours locale
    try {
      if (window.storage && window.storage.set) {
        await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    } catch(e) {}
  }, 300);
}

function fmtGNF(n){
  return new Intl.NumberFormat('fr-FR').format(Math.round(n)) + ' GNF';

function todayInRange(rangeStr, phaseId){
  const now = new Date();
  const ranges = {
    p1: [new Date(2026,7,1), new Date(2026,7,14,23,59)],
    p2: [new Date(2026,7,15), new Date(2026,7,31,23,59)],
    sep: [new Date(2026,8,1), new Date(2026,8,30,23,59)],
    oct: [new Date(2026,9,1), new Date(2026,9,31,23,59)],
    nov: [new Date(2026,10,1), new Date(2026,10,30,23,59)],
    dec: [new Date(2026,11,1), new Date(2026,11,31,23,59)],
  };
  const r = ranges[phaseId];
  if(!r) return false;
  return now >= r[0] && now <= r[1];
}
function phaseIsPast(phaseId){
  const now = new Date();
  const ends = {
    p1: new Date(2026,7,14,23,59), p2: new Date(2026,7,31,23,59),
    sep: new Date(2026,8,30,23,59), oct: new Date(2026,9,31,23,59),
    nov: new Date(2026,10,30,23,59), dec: new Date(2026,11,31,23,59),
  };
  return ends[phaseId] ? now > ends[phaseId] : false;
}

// Récupère les données d'agrégation SQL et met à jour les graphiques
async function updateStatsAndCharts() {
  try {
    const response = await fetch('/api/stats');
    if (!response.ok) return;
    const stats = await response.json();

    // 1. Mise à jour Avancement Global
    const pct = stats.global.total > 0 ? Math.round((stats.global.completed / stats.global.total) * 100) : 0;
    if (charts.global) {
      charts.global.updateSeries([pct]);
    }

    // 2. Mise à jour Progression par Phase
    const phasesMapping = { p1: 0, p2: 1, sep: 2, oct: 3, nov: 4, dec: 5, mamou: 6 };
    const completedArr = [0, 0, 0, 0, 0, 0, 0];
    const pendingArr = [0, 0, 0, 0, 0, 0, 0];

    stats.phases.forEach(p => {
      const idx = phasesMapping[p.phase_id];
      if (idx !== undefined) {
        completedArr[idx] = p.completed || 0;
        pendingArr[idx] = (p.total - p.completed) || 0;
      }
    });

    if (charts.phase) {
      charts.phase.updateSeries([
        { name: 'Complétées', data: completedArr },
        { name: 'À faire', data: pendingArr }
      ]);
    }

    // 3. Mise à jour Répartition Difficultés
    let facile = 0, moyenne = 0, elevee = 0;
    stats.difficulty.forEach(d => {
      if (d.difficulty === 'facile') facile = d.count;
      if (d.difficulty === 'moyenne') moyenne = d.count;
      if (d.difficulty === 'elevee') elevee = d.count;
    });

    if (charts.difficulty) {
      charts.difficulty.updateSeries([facile, moyenne, elevee]);
    }
  } catch (e) {
    console.error("Impossible de rafraîchir les graphiques :", e);
  }
}

  return `
    <div class="phase ${collapsed?'collapsed':''}" data-phase="${phase.id}">
      <div class="phase-head" data-toggle="${phase.id}">
        <div class="phase-head-left">

function renderTask(phaseId, groupIdx, t){
  const diffLabel = {facile:'Facile', moyenne:'Moyenne', elevee:'Élevée'}[t.difficulty] || 'Moyenne';
  return `
    <div class="task-row ${t.done?'done':''}" data-task="${t.id}" data-phase="${phaseId}" data-group="${groupIdx}">
      <div class="task-check" data-check="${t.id}">${t.done ? '<i class="fa-solid fa-check"></i>' : ''}</div>
      <div class="task-main">
        <div class="task-text" data-text="${t.id}">${t.text}</div>
        <div class="task-meta">
          <span class="diff-badge diff-${t.difficulty}" data-diff="${t.id}">${diffLabel}</span>
          <select class="move-select" data-move="${t.id}">
            <option value="">Déplacer vers...</option>
            ${allPhaseOptions('')}
          </select>
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" title="Modifier" data-edit="${t.id}"><i class="fa-regular fa-pen-to-square"></i></button>
        <button class="icon-btn delete" title="Supprimer" data-delete="${t.id}"><i class="fa-regular fa-trash-can"></i></button>

  `;

function findTask(taskId){
  for(const phase of state.phases){
    for(const group of phase.groups){
      const idx = group.tasks.findIndex(t => t.id === taskId);
      if(idx !== -1) return {phase, group, idx, task: group.tasks[idx]};
    }
  }
  return null;
}

function attachEvents(){
  const app = document.getElementById('app');

  // Toggle du Tableau de Bord
  const toggleBtn = document.getElementById('toggleDashboardBtn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      dashboardOpen = !dashboardOpen;
      const dash = document.getElementById('statsDashboard');
      if (dashboardOpen) {
        dash.classList.add('open');
        toggleBtn.classList.add('active');
        toggleBtn.innerHTML = '<i class="fa-solid fa-chart-pie"></i> Masquer le Tableau de Bord';
      } else {
        dash.classList.remove('open');
        toggleBtn.classList.remove('active');
        toggleBtn.innerHTML = '<i class="fa-solid fa-chart-pie"></i> Afficher le Tableau de Bord';
      }
    });
  }

  app.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-toggle');
      state.collapsed[id] = !state.collapsed[id];
      scheduleSave(); render();
    });
  });

  app.querySelectorAll('[data-jump]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-jump');
      state.collapsed[id] = false;
      scheduleSave(); render();
      setTimeout(() => {
        const target = document.querySelector(`.phase[data-phase="${id}"]`);
        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      }, 30);
    });
  });

  app.querySelectorAll('[data-check]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const found = findTask(el.getAttribute('data-check'));
      if(found){ found.task.done = !found.task.done; scheduleSave(); render(); }
    });
  });

  app.querySelectorAll('[data-diff]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const found = findTask(el.getAttribute('data-diff'));
      if(found){
        const order = ['facile','moyenne','elevee'];
        const next = order[(order.indexOf(found.task.difficulty)+1) % order.length];
        found.task.difficulty = next;
        scheduleSave(); render();
      }
    });
  });

  app.querySelectorAll('[data-delete]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const found = findTask(el.getAttribute('data-delete'));
      if(found && confirm('Supprimer cette tâche ?')){
        found.group.tasks.splice(found.idx, 1);
        scheduleSave(); render();
      }
    });
  });

  app.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const taskId = el.getAttribute('data-edit');
      const textEl = app.querySelector(`[data-text="${taskId}"]`);
      if(!textEl) return;
      const current = textEl.textContent;
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'task-text-input'; input.value = current;
      textEl.replaceWith(input);
      input.focus(); input.select();
      const commit = () => {
        const found = findTask(taskId);
        if(found){ found.task.text = input.value.trim() || current; scheduleSave(); }
        render();
      };
      input.addEventListener('keydown', (ev) => { if(ev.key==='Enter'){ commit(); } if(ev.key==='Escape'){ render(); } });
      input.addEventListener('blur', commit);
    });
  });

  app.querySelectorAll('[data-move]').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('change', (e) => {
      const taskId = el.getAttribute('data-move');
      const targetPhaseId = el.value;
      if(!targetPhaseId) return;
      const found = findTask(taskId);
      if(found){
        found.group.tasks.splice(found.idx, 1);
        const targetPhase = state.phases.find(p => p.id === targetPhaseId);
        if(targetPhase.groups.length === 0) targetPhase.groups.push({label:'Tâches', tasks:[]});
        targetPhase.groups[0].tasks.push(found.task);
        scheduleSave(); render();
      }
    });
  });

  app.querySelectorAll('[data-text]').forEach(el => {
    el.addEventListener('click', () => {
      const taskId = el.getAttribute('data-text');
      app.querySelector(`[data-edit="${taskId}"]`).click();
    });
  });

  app.querySelectorAll('[data-add-btn]').forEach(el => {
    el.addEventListener('click', () => {
      const phaseId = el.getAttribute('data-add-btn');
      const input = app.querySelector(`[data-add-input="${phaseId}"]`);
      const diffSel = app.querySelector(`[data-add-diff="${phaseId}"]`);
      const text = input.value.trim();
      if(!text) return;
      const phase = state.phases.find(p => p.id === phaseId);
      if(phase.groups.length === 0) phase.groups.push({label:'Tâches', tasks:[]});
      phase.groups[phase.groups.length-1].tasks.push({id:uid(), text, difficulty:diffSel.value, done:false});
      scheduleSave(); render();
    });
  });

  app.querySelectorAll('[data-add-input]').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        const phaseId = el.getAttribute('data-add-input');
        app.querySelector(`[data-add-btn="${phaseId}"]`).click();
      }
    });
  });

  const caisseInput = document.getElementById('caisseInput');
  if(caisseInput){
    caisseInput.addEventListener('change', () => {
      state.caisseActuelle = Number(caisseInput.value) || 0;
      scheduleSave(); render();
    });
  }

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', async () => {
      if(confirm('Réinitialiser toute la feuille de route aux tâches par défaut ? Cette action est irréversible.')){
        try {
          const res = await fetch('/api/reset', { method: 'POST' });
          if (res.ok) {
            state = await res.json();
            render();
            return;
          }
        } catch(e) {
          console.error("Erreur réinitialisation :", e);
        }
        state = defaultState();
        scheduleSave(); render();
      }
    });
  }
}

(async function init(){
  const loaded = await loadState();
  state = loaded || defaultState();
  if(!state.collapsed) state.collapsed = {};
  render();
})();
</script>
</body>
</html>
